<!--
Updated to include repository images. This file expects the following files to exist in the repository root (or adjust paths):
- Shop.jpeg
- DP.png
- Dish.png (removed from layout)
- Designer.png

If any filenames or locations are different, either upload the images at the repo root or update the src paths below.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paladice</title>
  <style>
    /* Elegant serif as brand font (fallback to system serif) */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');

    :root{ --bg:#fff9f2; --card:#fff; --accent:#b37d67; --muted:#6b6b6b }
    html,body{height:100%;margin:0;font-family:Inter, Roboto, -apple-system, "Segoe UI", sans-serif;background:var(--bg);color:#222}

    /* Compact background area that fits near the top instead of full fixed cover */
    .bg-cover{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:100%;max-width:1200px;height:min(40vh,420px);z-index:0;overflow:hidden;border-radius:12px;pointer-events:none}
    .bg-cover::before{
      content:"";position:absolute;inset:0;border-radius:12px;
      background-image: url('Designer.png');
      background-size: cover;
      background-position: center;
      opacity:1;
      filter:contrast(1.03) saturate(1.05) blur(0.2px);
    }
    /* removed the white/creamy overlay so the background image displays unobscured */
    .bg-cover::after{display:none;content:none}

    .wrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 24px 48px;z-index:1}
    header{width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}

    /* Brand name in elegant serif font to replace logo image */
    .site-brand{ text-decoration:none; color:inherit; display:inline-block }
    .brand-name{
      font-family:'Playfair Display', Georgia, 'PaladiceBrand', serif;
      font-weight:700;
      font-size:2.8rem;
      letter-spacing:0.01em;
      margin:0;
      color:#222;
      line-height:1;
      text-shadow: 0 2px 8px rgba(179,125,103,0.06);
    }

    /* Card uses a compact, semi-transparent background so the top background shows through */
    .card{background:rgba(255,255,255,0.86);border-radius:14px;box-shadow:0 10px 40px rgba(18,18,18,0.09);padding:20px;max-width:1200px;width:100%;text-align:left;margin-top:12vh}
    .card-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}

    .card-main{padding:8px}
    .card-main .lead{margin:0 0 12px;color:var(--muted);font-size:1.02rem;text-align:center}

    /* Shop aside: sticky so it doesn't scroll away; placed to the right in a clear area */
    .card-aside{position:relative}
    .shop{position:sticky;top:96px;display:flex;flex-direction:column;gap:12px;align-items:center;background:transparent;padding:8px;border-radius:10px}
    .shop img{width:100%;height:180px;object-fit:cover;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
    .shop .shop-title{font-family:'Playfair Display', Georgia, 'PaladiceBrand', serif;font-size:1.25rem;margin:4px 0;color:#222;font-weight:700;text-align:center}
    .shop .shop-desc{margin:0;color:var(--muted);font-size:0.98rem;text-align:center}

    /* Center DP image */
    .center-dp{display:flex;align-items:center;justify-content:center;margin:18px 0}
    .center-dp img{width:220px;height:220px;object-fit:cover;border-radius:50%;box-shadow:0 10px 30px rgba(12,12,12,0.15);border:6px solid rgba(255,255,255,0.35)}

    .footer-note{margin-top:18px;color:#7a7a7a;font-size:0.95rem;text-align:center}

    /* Remove masterpiece/dish styles (section removed) */

    @media (max-width:1100px){.card{max-width:920px}.card-grid{grid-template-columns:1fr 300px}}
    @media (max-width:820px){
      .card{padding:16px;margin-top:8vh}
      .card-grid{grid-template-columns:1fr}
      .shop{position:static}
      .shop img{height:160px}
      .brand-name{font-size:2.1rem}
      .bg-cover{height:min(28vh,260px)}
    }
  </style>
</head>
<body>
  <div class="bg-cover" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <!-- Paladice site title in elegant font (replaces the logo image) -->
      <a class="site-brand" href="/" aria-label="Paladice homepage">
        <h1 class="brand-name">Paladice</h1>
      </a>
    </header>

    <main class="card" role="main">
      <div class="card-grid">
        <div class="card-main">
          <p class="lead">an Adicts venture project</p>

          <!-- DP centered -->
          <section class="center-dp" aria-label="Profile">
            <img src="DP.png" alt="Profile DP" />
          </section>

          <!-- Removed the 'Our Masterpiece' section as requested -->

          <p class="footer-note">EST 2026 by Adicts venture</p>
        </div>

        <aside class="card-aside" aria-label="Shop">
          <!-- Shop stays in the right column and will be sticky (won't scroll away) -->
          <section class="shop" aria-label="Shop highlights">
            <img src="Shop.jpeg" alt="Shop preview" />
            <h2 class="shop-title">Our Shop</h2>
            <p class="shop-desc">Explore curated items in our store — featured selections and handpicked creations.</p>
          </section>
        </aside>
      </div>

    </main>

  </div>

  <script>
    // Fallback: if image paths have been uploaded inside an `assets/` or `images/` folder, try those automatically.
    document.querySelectorAll('img').forEach(img=>{
      img.addEventListener('error', ()=>{
        const src = img.getAttribute('src');
        const tries = ['assets/'+src, 'images/'+src, 'assets/'+encodeURIComponent(src)];
        for(const t of tries){
          if(!img.dataset.tried){ img.dataset.tried = 1; img.src = t; return; }
        }
      });
    });
  </script>
</body>
</html>
