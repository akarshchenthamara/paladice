<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pāladice</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

    :root{
      --accent: #7d5638;
      --bg: #f7efe4;
      --muted: rgba(32,26,23,0.7);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background: linear-gradient(135deg,#f7efe4 0%,#e9d8b7 60%,#efe0c7 100%);
      color:var(--muted);
      position:relative;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }

    /* backdrop image */
    body::before{
      content:"";
      position:fixed;inset:0;
      background:url('samplev2.jpg') center center / cover no-repeat fixed;
      opacity:0.34;filter:saturate(0.9) contrast(1.06) brightness(0.96) blur(0.2px);
      transform:scale(1.06);
      pointer-events:none;z-index:0;
    }

    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(123,96,68,0.04) 40%,rgba(255,255,255,0.04));
    }

    .wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center}

    .card{
      text-align:center;padding:36px 28px;border-radius:18px;
      background:linear-gradient(180deg,rgba(255,255,255,0.18),rgba(255,255,255,0.08));
      border:1px solid rgba(120,90,60,0.12);box-shadow:0 24px 64px rgba(52,33,19,0.12);
      backdrop-filter:blur(8px);
      max-width:860px;width:min(92%,860px);
      position:relative;
    }

    .brand{
      font-family:'Playfair Display',serif;font-size:clamp(3.2rem,7vw,6rem);color:var(--accent);letter-spacing:-0.02em;margin-bottom:18px;
      text-shadow:0 6px 28px rgba(96,64,39,0.12);
    }

    .sub{
      font-size:0.95rem;color:var(--muted);margin-bottom:28px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;
    }

    .join-btn{
      display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:linear-gradient(135deg,#7d5638 0%,#5b3d2c 100%);color:#fff;text-decoration:none;font-weight:700;letter-spacing:0.02em;
      box-shadow:0 10px 24px rgba(91,61,44,0.18);transition:transform 0.2s ease, box-shadow 0.2s ease;
    }

    .join-btn:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(91,61,44,0.22)}

    .join-ico{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,0.12);backdrop-filter:blur(6px);}

    .join-ico svg{width:22px;height:22px;display:block;fill:#fff}

    @media (max-width:720px){
      .brand{font-size:3.2rem}
      .card{padding:24px}
    }
  </style>
  <link rel="stylesheet" href="paladice-cone.css">
</head>
<body>
  <div class="wrap">
    <div class="card" role="main">
      <div class="brand">Pāladice</div>
      <div class="sub">An Adicts Venture</div>
      <a class="join-btn" href="details.html" aria-label="Join us — see more about Pāladice">
        <span class="join-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.5v-3h2v3h-2zm0-7V7h2v2.5h-2zm-1 0V7H8v2.5h2v7H8v2.5h4v-2.5h-2v-7h2zm5 0V7h2v2.5h-2zm-7 0V7h2v2.5H8zm7 7v-3h2v3h-2z"/></svg>
        </span>
        <span>Join us</span>
      </a>

      <div class="cone-wrapper" aria-hidden="true">
        <img src="assets/paladice-cone-placeholder.svg" alt="Paladice cone" class="cone-img">
        <div class="eye left-eye"><div class="pupil"></div></div>
        <div class="eye right-eye"><div class="pupil"></div></div>
      </div>
    </div>
  </div>

  <script src="paladice-cone.js" defer></script>
</body>
</html>
