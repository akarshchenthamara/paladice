<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pāladice — Details</title>
  <link rel="stylesheet" href="paladice-cone.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

    :root { --brown-900:#2a1e16; --brown-700:#5b3b28; --muted:rgba(32,26,23,0.72); --card-bg: rgba(255,255,255,0.14); }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--muted);
      min-height:100vh;
      position:relative;
      background:linear-gradient(135deg,#f7efe4 0%,#e9d8b7 28%,#d7b995 58%,#efe0c7 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* backdrop image */
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:url('samplev2.jpg') center center / cover no-repeat fixed;
      opacity:0.32;filter:saturate(0.9) contrast(1.06) brightness(0.96) blur(0.2px);
      transform:scale(1.04);
    }
    body::after{content:'';position:fixed;inset:0;background:linear-gradient(90deg,rgba(247,239,228,0.2),rgba(255,255,255,0.08));pointer-events:none;z-index:0}

    nav{position:sticky;top:0;z-index:10;background:rgba(247,239,228,0.62);backdrop-filter:blur(14px);border-bottom:1px solid rgba(91,59,40,0.12)}
    .nav-container{max-width:1220px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px}
    .logo{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--brown-700);text-decoration:none}
    .cta-button{background:linear-gradient(135deg,#7d5638 0%,#5f3d2a 100%);color:#fff;padding:9px 18px;border-radius:999px;text-decoration:none}

    main{max-width:1220px;margin:36px auto;padding:0 22px 80px;position:relative;z-index:1}

    /* layout */
    .hero{display:grid;grid-template-columns:1fr 0.88fr;gap:36px;align-items:center;min-height:520px}
    .hero .hero-sub{font-size:0.8rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--brown-700);font-weight:700;margin-bottom:18px}
    .hero h1{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,5vw,4.4rem);color:var(--brown-900);line-height:1;margin-bottom:18px}
    .hero-subtopic{font-size:1.1rem;color:var(--brown-700);font-weight:600;margin-bottom:18px;line-height:1.6}
    .hero p{color:var(--muted);max-width:620px;line-height:1.85}

    /* image shell - now allows perspective and bottom-right placement */
    .image-shell{
      position:relative;
      border-radius:26px;
      padding:18px;
      overflow:visible;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      background:radial-gradient(circle at 60% 30%, rgba(255,244,220,0.55), rgba(255,235,200,0.22) 30%, rgba(196,150,100,0.10) 70%);
      box-shadow:0 48px 120px rgba(80,48,20,0.28), inset 0 -18px 48px rgba(255,245,230,0.06);
      border:1px solid rgba(124,89,61,0.12);
      backdrop-filter: blur(2px);
      perspective:1200px;              /* enable 3d perspective for children */
      justify-self:end;               /* place the whole shell to the right column end */
      align-self:end;                 /* align to bottom of the hero grid cell */
    }

    .image-shell::before{content:'';position:absolute;left:50%;top:32%;transform:translate(-6%,-32%);width:68%;height:68%;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle at 45% 35%, rgba(255,218,150,0.45), rgba(255,200,120,0.16) 40%, rgba(255,160,60,0.06) 70%);filter:blur(28px);mix-blend-mode:screen;opacity:0.95;
    }
    .image-shell::after{content:'';position:absolute;inset:0;border-radius:26px;pointer-events:none;background:radial-gradient(60% 60% at 52% 35%, rgba(255,245,230,0.06), rgba(0,0,0,0.06) 60%);box-shadow: inset 0 -60px 120px rgba(0,0,0,0.06);}

    /* mascot image: show full image and give a subtle 3D bottom-right tilt on larger screens */
    .image-shell img.mascot{
      width: 100%;
      height: auto;
      max-width: 520px;
      object-fit: contain;
      object-position: center;
      border-radius: 10px;
      display:block;
      /* 3D effect and bottom-right shift */
      transform-origin: 60% 80%;
      transform: translate3d(10%,18%,36px) rotateX(6deg) rotateY(-8deg) scale(1);
      filter: drop-shadow(0 64px 96px rgba(34,20,12,0.48)) saturate(1.12) contrast(1.08) brightness(1.03);
      transition: transform 450ms cubic-bezier(.2,.8,.2,1), filter 250ms ease;
      will-change: transform;
    }
