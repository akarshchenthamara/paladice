<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paladice — Details</title>
  <link rel="stylesheet" href="paladice-cone.css" />
  <style>
    body { margin:0; font-family: Georgia, 'Times New Roman', serif; background: radial-gradient(ellipse at 20% 10%, rgba(255,250,245,0.08), transparent 20%), linear-gradient(180deg,#f8eeda,#f6e0c8); color:#4b2f1f; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .detail-wrap { max-width:1200px; width:100%; padding:48px; display:flex; gap:48px; align-items:center; justify-content:center; }
    .detail-left { flex:1; text-align:left; padding:30px; }
    .detail-right { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
    .detail-cone { width:560px; max-width:48vw; border-radius:14px; box-shadow:0 30px 80px rgba(15,10,8,0.25); }
    .headline { font-size:48px; letter-spacing:1px; margin:0 0 10px; font-family:'Playfair Display',serif; }
    .tagline { font-size:12px; color:#6b4f3e; text-transform:uppercase; letter-spacing:4px; margin-bottom:20px; }
    .cta { display:inline-block; background:#6d462f; color:white; padding:12px 22px; border-radius:40px; text-decoration:none; margin-top:20px; box-shadow:0 6px 18px rgba(109,70,47,0.25);}  
  </style>
</head>
<body>
  <main class="detail-wrap">
    <section class="detail-left">
      <div class="tagline">HOME OF DECADENCE</div>
      <h1 class="headline">Paladice</h1>
      <p style="max-width:520px; color:#5c3f2d; line-height:1.6;">A rich experience built around texture and flavor — a crafted identity that blends visual decadence with refined minimalism. Explore the textures, the notes, and the story behind each creation.</p>
      <a class="cta" href="/">Back to home</a>
    </section>

    <aside class="detail-right">
      <img class="detail-cone cone-floating" src="assets/paladice-cone-placeholder.svg" alt="Paladice cone">
    </aside>
  </main>

  <script src="paladice-cone.js"></script>
</body>
</html>
